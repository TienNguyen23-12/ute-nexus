services:
  postgres:
    image: postgres:16-alpine
    container_name: utenexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-utenexus_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-utenexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - utenexus-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: utenexus-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@utenexus.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - utenexus-network

  adminer:
    image: adminer:latest
    container_name: utenexus-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    networks:
      - utenexus-network

volumes:
  postgres_data:
    name: utenexus_postgres_data
  pgadmin_data:
    name: utenexus_pgadmin_data

networks:
  utenexus-network:
    name: utenexus_network
    driver: bridge
